    <style>
        :root {
            --bg-color: #090a0f;
            --card-bg: #121620;
            --border-color: #1e293b;
            --accent-red: #ef4444;
            --accent-yellow: #facc15;
            --accent-green: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --header-bg: linear-gradient(135deg, #180303, #090a0f);
        }
        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;

            --accent-yellow: #ca8a04;
            --accent-green: #16a34a;

            --header-bg: linear-gradient(135deg, #fee2e2, #f1f5f9);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 10px; transition: 0.3s; }
        .container { max-width: 520px; margin: 0 auto; background: var(--card-bg); border-radius: 20px; overflow: hidden; border: 2px solid var(--accent-red); box-shadow: 0 15px 35px rgba(239, 68, 68, 0.2); }
        
        /* Top Utility Bar */
        .top-bar { display: flex; justify-content: space-between; padding: 10px 15px; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border-color); font-size: 12px; }
        .toggle-btn { background: var(--border-color); color: var(--text-main); border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        .mascot-box { width: 90px; height: 90px; margin: 0 auto 10px; border-radius: 50%; border: 3px solid var(--accent-yellow); overflow: hidden; background: #ef4444; box-shadow: 0 0 15px rgba(250, 204, 21, 0.4); }
        .mascot-box svg { width: 100%; height: 100%; }
        .header h1 { color: var(--accent-yellow); font-size: 18px; font-weight: bold; letter-spacing: 0.5px; }
        .header p { color: var(--text-muted); font-size: 11px; margin-top: 3px; }

        /* Navigation Tabs */
        .tabs { display: flex; background: var(--border-color); overflow-x: auto; }
        .tab-btn { flex: 1; padding: 10px; text-align: center; font-size: 12px; font-weight: bold; color: var(--text-muted); background: none; border: none; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { color: var(--accent-yellow); background: var(--card-bg); border-bottom: 2px solid var(--accent-yellow); }

        .tab-content { display: none; padding: 15px; }
        .tab-content.active { display: block; }

        .section-title { font-size: 14px; color: var(--accent-yellow); margin-bottom: 10px; font-weight: bold; display: flex; align-items: center; gap: 8px; }

        /* Split Graphs Container */

        .graph-card h4 { font-size: 11px; color: var(--text-muted); margin-bottom: 5px; }
